services:
  backend:
    build: ./docker/php
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_DSN: "mysql:host=db;dbname=vite_et_gourmand;charset=utf8mb4"
      DB_USER: app
      DB_PASS: app
      MONGO_URI: "mongodb://mongo:27017"
      FRONT_URL: "http://localhost:5500"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: vite_et_gourmand
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5500:5500"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: db
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
  mongo_data: